<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <title>FitBuddy - AI Fitness Plan</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f4f9; padding: 50px; }
        .container { background: white; padding: 30px; border-radius: 10px; display: inline-block; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        input, button { padding: 10px; margin: 10px; width: 80%; }
        button { background-color: #28a745; color: white; border-radius: 5px; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1>FitBuddy - AI Fitness Plan</h1>
        <h2>{{ message }}</h2>
        <form action="/generate" method="POST">
            <input type="text" name="goal" placeholder="உங்கள் இலக்கை உள்ளிடவும்" required>
            <br>
            <button type="submit">திட்டத்தை உருவாக்கு</button>
        </form>
    </div>
</body>
</html>
